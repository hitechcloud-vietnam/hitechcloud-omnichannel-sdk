[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitechcloud-omnichannel"
version = "1.0.0"
description = "SDK chính thức cho HiTechCloud Omnichannel API (hội thoại đa kênh)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "HiTechCloud Vietnam", email = "support@hitechcloud.vn"},
]
keywords = ["hitechcloud", "omnichannel", "facebook", "zalo", "tiktok", "instagram", "chat", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23"]

[project.urls]
Homepage = "https://github.com/hitechcloud-vietnam/hitechcloud-omnichannel-sdk"
Documentation = "https://developers.hitechcloud.vn"
Repository = "https://github.com/hitechcloud-vietnam/hitechcloud-omnichannel-sdk"
Issues = "https://github.com/hitechcloud-vietnam/hitechcloud-omnichannel-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hitechcloud_omnichannel*"]
